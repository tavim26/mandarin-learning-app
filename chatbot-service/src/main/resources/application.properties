spring.application.name=chatbot-service
server.port=8084

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=3s
gemini.read-timeout=25s
gemini.max-attempts=2
gemini.max-output-tokens=2048

# Chat
chatbot.context.window-size=20
chatbot.rate-limit.max-messages=15
chatbot.rate-limit.window=60s