spring.application.name=progress-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/progress_database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

content-service.url=${CONTENT_SERVICE_URL:http://localhost:8081}
content-service.connect-timeout=3s
content-service.read-timeout=5s